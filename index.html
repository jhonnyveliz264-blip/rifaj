<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rifa Bleu Femme L'BEL</title>
<style>
:root{--navy:#0a4678;--gold:#c49a4c;--blue:#0096d6;--cell2:#d6ecf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);background:linear-gradient(180deg,#0096d6 0%,#eaf6fb 60%) #eaf6fb;overflow:hidden}
.wrap{max-width:560px;height:100%;margin:0 auto;padding:10px 10px 10px;display:flex;flex-direction:column;gap:8px}
.head{display:flex;gap:10px;align-items:stretch;flex:0 0 auto}
.photo{background:#fff;padding:4px;border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.3);flex:0 0 auto;height:clamp(130px,25vh,210px)}
.photo img{display:block;height:100%;width:auto;border-radius:5px}
.info{flex:1;min-width:0;text-align:center;color:#fff;display:flex;flex-direction:column;justify-content:center}
h1{margin:0;font-size:clamp(24px,7vw,40px);letter-spacing:1px;line-height:1.05}
.line{height:3px;background:var(--gold);width:80%;margin:4px auto}
.name{font-size:clamp(17px,5vw,28px);font-weight:800;line-height:1.1}
.brand{font-size:clamp(14px,4vw,22px);font-weight:800;color:#ffe6a0}
.sub{font-size:clamp(11px,2.8vw,15px);margin-bottom:5px}
.box{background:#fff;color:var(--navy);border-radius:12px;padding:5px 6px;margin:3px 0;font-weight:800;font-size:clamp(12px,3.4vw,17px);display:flex;align-items:center;justify-content:center;gap:5px}
.box input{border:0;border-bottom:2px solid var(--navy);background:transparent;color:var(--navy);font:inherit;width:44%;text-align:center;outline:0;min-width:0;padding:0}
.stats{display:flex;justify-content:center;gap:8px;font-weight:700;font-size:13px;flex:0 0 auto;align-items:center}
.stats span{background:#fff;border:2px solid var(--blue);border-radius:20px;padding:2px 10px}
.stats em{font-style:normal;font-size:12px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(8,1fr);gap:4px}
.c{border:2px solid #0082be;border-radius:8px;background:#fff;color:var(--navy);font-weight:800;font-size:clamp(10px,3.3vw,17px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer;line-height:1.05;font-family:inherit;min-width:0;min-height:0;overflow:hidden}
.c:nth-child(even){background:var(--cell2)}
.c.s{background:var(--gold)!important;border-color:#8a6a2c;color:#fff;position:relative}
.c.s::after{content:"";position:absolute;inset:3px;background:linear-gradient(to top right,transparent calc(50% - 2px),#fff calc(50% - 2px),#fff calc(50% + 2px),transparent calc(50% + 2px)),linear-gradient(to bottom right,transparent calc(50% - 2px),#fff calc(50% - 2px),#fff calc(50% + 2px),transparent calc(50% + 2px));pointer-events:none}
.c small{font-size:clamp(6px,1.8vw,9px);max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;position:relative;z-index:1}
.luck{grid-column:span 5;background:var(--gold);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(12px,3.6vw,20px)}
.bar{display:flex;gap:8px;flex:0 0 auto}
.bar button{flex:1;border-radius:20px;padding:10px 8px;font-weight:800;font-size:14px;font-family:inherit}
#dl{background:var(--navy);color:#fff;border:2px solid var(--navy)}
#reset{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.card{background:#fff;color:var(--navy);border-radius:18px;padding:18px;width:100%;max-width:340px;text-align:center;max-height:100%;overflow:auto}
.card h2{margin:0 0 12px;font-size:21px}
.card p{margin:0 0 10px;font-size:14px}
.card img{width:100%;border-radius:8px;margin-bottom:10px}
.card input{width:100%;border:2px solid var(--blue);border-radius:12px;padding:10px;font-size:16px;color:var(--navy);margin-bottom:12px}
.btns{display:flex;gap:8px}
.btns button{flex:1;border:0;border-radius:12px;padding:12px 6px;font-weight:800;font-size:15px;color:#fff;background:var(--blue)}
.btns .g{background:var(--gold)}.btns .x{background:#8a97a3}.btns .r{background:#c0392b}
